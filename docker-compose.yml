version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: yoga-studio-db
    environment:
      POSTGRES_USER: yogauser
      POSTGRES_PASSWORD: yogapass
      POSTGRES_DB: yogastudio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yogauser -d yogastudio"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: yogatest
      POSTGRES_PASSWORD: yogatest
      POSTGRES_DB: yogastudio_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yogatest -d yogastudio_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  postgres_test_data:
